# Redis-style directives; command-line options override this file.
bind 127.0.0.1
port 2000
engine hash
network reactor
persistence full
snapshot-file data/kvstore.snapshot
aof-file data/kvstore.aof
mysql-enabled no

role standalone
sync-transport tcp
replication-port 0
sync-timeout-ms 5000
sync-reconnect-ms 1000
sync-queue-bytes 8388608
sync-snapshot-bytes 67108864

ebpf-enabled no
ebpf-object build/bpf/kvs_sockhash.bpf.o
ebpf-map /sys/fs/bpf/kvstore_sync

# Used only with make MYSQL=1 and mysql-enabled yes.
mysql-host 127.0.0.1
mysql-port 3306
mysql-user root
mysql-password ""
mysql-database kvstore
mysql-table kvs_records
