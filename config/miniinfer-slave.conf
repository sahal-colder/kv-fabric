# Replication V2 requires the same private random 32..128 byte secret on both peers.
# Generate with: openssl rand -hex 32. Add replication-secret VALUE to private configs.
# No default secret is provided; this example fails closed until configured.
bind 127.0.0.1
port 7380
engine hash
network reactor
persistence none
mysql-enabled no
role slave
master-host 127.0.0.1
master-port 17379
sync-transport tcp
sync-timeout-ms 5000
sync-reconnect-ms 1000
sync-queue-bytes 8388608
sync-snapshot-bytes 67108864
ebpf-enabled no
ebpf-object build/bpf/kvs_sockhash.bpf.o
ebpf-map /sys/fs/bpf/kvstore_sync
