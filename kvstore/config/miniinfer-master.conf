# Metadata directory for a future MiniInfer integration. No tensor payloads.
bind 127.0.0.1
port 7379
engine hash
network reactor
persistence none
mysql-enabled no
role master
replication-port 17379
sync-transport tcp
sync-timeout-ms 5000
sync-reconnect-ms 1000
sync-queue-bytes 8388608
sync-snapshot-bytes 67108864
ebpf-enabled no
ebpf-object build/bpf/kvs_sockhash.bpf.o
ebpf-map /sys/fs/bpf/kvstore_sync
